<?xml version="1.0" encoding="UTF-8"?>
<!-- Neutral placeholder app icon, 1024x1024. Abstract studio-blocks + a
     "you are here" dot. No wordmark, no trademark, and NOT a trace of any
     real map — purely generic geometry. Regenerate the PNGs with:
       node generate-placeholder-icons.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Solid background — App Store icons can't have transparency. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#0a0a0a"/>
  <!-- Four abstract studio blocks, leaving a cross-shaped "street" gap. -->
  <g fill="#ececec">
    <rect x="164" y="164" width="307" height="307" rx="18"/>
    <rect x="553" y="164" width="307" height="184" rx="18"/>
    <rect x="553" y="410" width="307" height="450" rx="18"/>
    <rect x="164" y="553" width="307" height="307" rx="18"/>
  </g>
  <!-- "You are here" dot at the crossing. -->
  <circle cx="512" cy="512" r="54" fill="#0a0a0a"/>
  <circle cx="512" cy="512" r="40" fill="#3b82f6"/>
</svg>
