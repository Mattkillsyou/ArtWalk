<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1019 913" width="1019" height="913">

  <!-- Editing instructions:
       1. Open this file in Illustrator, Inkscape, or Figma.
       2. The labeled campus map shows underneath at 50% opacity.
       3. Drag and resize each red rectangle to fit its building on the map.
          Each rect is named with the building address (object name / id).
       4. 642 Moulton has TWO rects (West and East wings) — drag each separately.
       5. Don't change the viewBox or rotate / skew shapes.
       6. Save / Export as plain SVG. Filename `template.svg` overwrites this.
       7. Tell Claude when saved — the parser reads x/y/width/height by id. -->

  <!-- Background reference (the canonical labeled campus map). -->
  <image href="map_greyscale.jpg" xlink:href="map_greyscale.jpg"
         x="0" y="0" width="1019" height="913" opacity="0.5"/>

  <!-- All buildings. Edit these. Stroke is red so they're visible against
       greyscale background. Fill is none so the map shows through. -->
  <g id="buildings" fill="none" stroke="#e60000" stroke-width="2">

    <!-- Top row, fronting N. Main Street -->
    <rect id="1910 N. Main Street"   x="90"  y="50"  width="115" height="100"/>
    <rect id="1980 N. Main Street"   x="265" y="60"  width="50"  height="115"/>
    <rect id="602 Moulton Avenue"    x="270" y="175" width="45"  height="90"/>
    <rect id="1984 N. Main Street"   x="315" y="60"  width="270" height="200"/>
    <rect id="2020 N. Main Street"   x="585" y="60"  width="150" height="215"/>
    <rect id="2100 N. Main Street"   x="735" y="60"  width="175" height="235"/>

    <!-- Studio row inside south face of 1984 -->
    <rect id="604 Moulton Avenue"    x="395" y="215" width="50"  height="50"/>
    <rect id="610 Moulton Avenue"    x="535" y="215" width="50"  height="50"/>

    <!-- 612 vertical strip + 1930-50 row near 600 -->
    <rect id="612 Moulton Avenue"    x="540" y="145" width="55"  height="175"/>
    <rect id="1930 N. Main Street"   x="240" y="200" width="50"  height="45"/>
    <rect id="1940 N. Main Street"   x="290" y="200" width="50"  height="45"/>
    <rect id="1950 N. Main Street"   x="340" y="200" width="45"  height="45"/>

    <!-- Central core -->
    <rect id="600 Moulton Avenue"    x="315" y="245" width="225" height="170"/>
    <rect id="620 Moulton Avenue"    x="540" y="355" width="145" height="110"/>

    <!-- East cluster + 645 -->
    <rect id="626 Moulton Avenue"    x="695" y="355" width="40"  height="30"/>
    <rect id="621 Avenue 21"         x="740" y="355" width="40"  height="30"/>
    <rect id="624 Moulton Avenue"    x="700" y="385" width="85"  height="30"/>
    <rect id="622 Moulton Avenue"    x="695" y="415" width="90"  height="35"/>
    <rect id="645 Moulton Avenue"    x="800" y="410" width="45"  height="40"/>
    <rect id="660 South Avenue 21"   x="720" y="460" width="135" height="75"/>

    <!-- 1918 / 1920 / 618 row -->
    <rect id="1918 N. Main Street"   x="120" y="420" width="110" height="85"/>
    <rect id="1920 N. Main Street"   x="230" y="420" width="45"  height="85"/>
    <rect id="618 Moulton Avenue"    x="240" y="420" width="300" height="55"/>

    <!-- 650 Moulton far-west vertical strip -->
    <rect id="650 Moulton Avenue"    x="85"  y="400" width="45"  height="110"/>

    <!-- 630-638 vertical block (data has 632/634/638 separately) -->
    <rect id="632 Moulton Avenue"    x="380" y="410" width="35"  height="30"/>
    <rect id="634 Moulton Avenue"    x="380" y="440" width="35"  height="30"/>
    <rect id="638 Moulton Avenue"    x="380" y="470" width="35"  height="30"/>

    <!-- 642 Moulton — TWO PARALLEL VERTICAL WINGS in a group -->
    <g id="642 Moulton Avenue">
      <rect id="642 W" x="395" y="475" width="55" height="225"/>
      <rect id="642 E" x="450" y="490" width="60" height="210"/>
    </g>

    <!-- 670 Moulton small block by GARDEN -->
    <rect id="670 Moulton Avenue"    x="555" y="575" width="70"  height="50"/>

    <!-- 672 / 650 / 676 east-south column -->
    <rect id="672 South Avenue 21"   x="520" y="560" width="165" height="65"/>
    <rect id="650 South Avenue 21"   x="720" y="560" width="130" height="70"/>
    <rect id="676 South Avenue 21"   x="735" y="680" width="110" height="60"/>

    <!-- SW cluster -->
    <rect id="696 Moulton Avenue"    x="140" y="565" width="75"  height="65"/>
    <rect id="690 Moulton Avenue"    x="215" y="565" width="60"  height="65"/>
    <rect id="692 Moulton Avenue"    x="275" y="625" width="60"  height="65"/>

  </g>
</svg>
