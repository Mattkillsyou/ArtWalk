<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Brewery Art Walk</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: #000;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  header {
    flex: 0 0 auto;
    padding: env(safe-area-inset-top) 12px 8px;
    padding-top: calc(env(safe-area-inset-top) + 8px);
    background: #fff;
    border-bottom: 1px solid #000;
    z-index: 5;
  }
  #title {
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.18em;
    color: #000;
    margin: 0 0 8px;
    text-transform: uppercase;
  }
  #search {
    width: 100%;
    height: 44px;
    padding: 0 12px;
    border: 1px solid #000;
    border-radius: 0;
    font-size: 16px;
    font-family: inherit;
    background: #fff;
    color: #000;
    -webkit-appearance: none;
    appearance: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #search:focus {
    outline: 2px solid #000;
    outline-offset: -1px;
  }
  #chips {
    flex: 0 0 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 12px;
    gap: 6px;
    background: #fff;
    border-bottom: 1px solid #000;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    height: 36px;
    min-width: 44px;
    padding: 0 14px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    font: 13px/34px inherit;
    letter-spacing: 0.02em;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    background: #000;
    color: #fff;
  }
  #map-container {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background: #fafafa;
  }
  #map {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #status {
    position: absolute;
    bottom: 12px;
    left: 12px;
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: #000;
    background: rgba(255,255,255,0.95);
    padding: 6px 8px;
    border: 1px solid #000;
    pointer-events: none;
    max-width: calc(100% - 80px);
  }
  #zoom-controls {
    position: absolute;
    right: 12px;
    bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  #zoom-controls button {
    width: 44px;
    height: 44px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    font: 18px/1 inherit;
    cursor: pointer;
    margin-bottom: -1px;
    -webkit-appearance: none;
    appearance: none;
  }
  #zoom-controls button:active {
    background: #000;
    color: #fff;
  }

  /* Map element styling */
  .bld-rect {
    fill: #fff;
    stroke: #000;
    stroke-width: 1.4;
    cursor: pointer;
  }
  .bld-group.dim .bld-rect { opacity: 0.18; }
  .bld-group.dim .bld-label,
  .bld-group.dim .bld-name,
  .bld-group.dim .badge-circle,
  .bld-group.dim .badge-text { opacity: 0.3; }
  .bld-group.selected .bld-rect { fill: #222; }
  .bld-group.selected .bld-label { fill: #fff; }
  .bld-group.selected .bld-name { fill: #fff; }
  .bld-label {
    fill: #000;
    font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    text-anchor: middle;
    pointer-events: none;
    font-weight: 700;
  }
  .bld-name {
    fill: #000;
    font: 8px/1 ui-monospace, "SF Mono", Menlo, monospace;
    text-anchor: middle;
    pointer-events: none;
  }
  .bld-name.hidden { display: none; }
  .badge-circle {
    fill: #000;
    pointer-events: none;
  }
  .badge-text {
    fill: #fff;
    font: 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
    font-weight: 700;
    text-anchor: middle;
    pointer-events: none;
  }
  .badge-hidden { display: none; }
  .street-strip { fill: #ededed; }
  .street-label {
    fill: #777;
    font: 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.22em;
    pointer-events: none;
    font-weight: 600;
  }
  .landmark {
    fill: #fff;
    stroke: #888;
    stroke-width: 1;
    stroke-dasharray: 4 3;
  }
  .landmark-label {
    fill: #555;
    font: 10px/1 ui-monospace, "SF Mono", Menlo, monospace;
    text-anchor: middle;
    pointer-events: none;
  }
  .courtyard {
    fill: #e9efe2;
    stroke: #b9c2a8;
    stroke-width: 1;
  }
  /* Overlay mode (?overlay=1) — show paper map underneath, buildings as red outlines */
  body.overlay-mode .bld-rect {
    fill: rgba(255, 40, 40, 0.16);
    stroke: #e30;
    stroke-width: 1.6;
  }
  body.overlay-mode .street-strip { opacity: 0.18; }
  body.overlay-mode .street-label { opacity: 0.4; }
  body.overlay-mode .bld-label,
  body.overlay-mode .bld-name,
  body.overlay-mode .badge-circle,
  body.overlay-mode .badge-text { display: none; }
  .bld-divider {
    stroke: #000;
    stroke-width: 1;
    stroke-dasharray: 3 3;
    fill: none;
    pointer-events: none;
  }
  .bld-sub-label {
    fill: #000;
    font: 9px/1 ui-monospace, "SF Mono", Menlo, monospace;
    text-anchor: middle;
    pointer-events: none;
  }

  /* Bottom sheet */
  #sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 65vh;
    max-height: 65dvh;
    background: #fff;
    border-top: 1px solid #000;
    transform: translateY(100%);
    transition: transform 0.25s ease;
    z-index: 10;
    padding: 14px 20px calc(env(safe-area-inset-bottom) + 14px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #sheet.open { transform: translateY(0); }
  #sheet-handle {
    width: 36px;
    height: 4px;
    background: #000;
    margin: 0 auto 10px;
  }
  #sheet-close {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 44px;
    height: 44px;
    border: 0;
    background: transparent;
    font: 22px/1 inherit;
    color: #000;
    cursor: pointer;
  }
  #sheet-body h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    user-select: text;
    -webkit-user-select: text;
  }
  #sheet-body .meta {
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
    user-select: text;
    -webkit-user-select: text;
  }
  #sheet-body .building-head {
    font: 11px/1.2 ui-monospace, "SF Mono", Menlo, monospace;
    color: #555;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    user-select: text;
    -webkit-user-select: text;
  }
  #sheet-body .bio {
    font-size: 14px;
    line-height: 1.5;
    margin: 14px 0;
    white-space: pre-wrap;
    user-select: text;
    -webkit-user-select: text;
  }
  #sheet-body .links {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0;
  }
  #sheet-body .links a {
    display: inline-block;
    height: 44px;
    line-height: 42px;
    padding: 0 16px;
    border: 1px solid #000;
    color: #000;
    text-decoration: none;
    font-size: 14px;
  }
  #sheet-body .links a:active {
    background: #000;
    color: #fff;
  }
  #sheet-body img.thumb {
    width: 100%;
    max-height: 240px;
    object-fit: cover;
    border: 1px solid #000;
    margin: 14px 0;
    display: block;
    background: #f5f5f5;
  }
  #sheet-body .artist-list { list-style: none; padding: 0; margin: 0; }
  #sheet-body .artist-list li {
    border-bottom: 1px solid #000;
  }
  #sheet-body .artist-list li:first-child { border-top: 1px solid #000; }
  #sheet-body .artist-list button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 4px;
    background: none;
    border: 0;
    font: 14px/1.3 inherit;
    color: #000;
    cursor: pointer;
    min-height: 56px;
  }
  #sheet-body .artist-list button:active { background: #f0f0f0; }
  #sheet-body .a-name { font-weight: 600; }
  #sheet-body .a-meta { font-size: 12px; color: #555; }
  #sheet-body .empty {
    text-align: center;
    color: #555;
    padding: 32px 0;
    font-size: 14px;
  }
  #sheet-body .back-btn {
    display: inline-block;
    height: 32px;
    line-height: 30px;
    padding: 0 12px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    font: 12px/30px inherit;
    cursor: pointer;
    margin-bottom: 12px;
  }
  #sheet-body .back-btn:active { background: #000; color: #fff; }

  #error-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid #000;
    background: #fff;
    padding: 16px;
    font: 13px/1.4 ui-monospace, monospace;
    max-width: 320px;
    text-align: left;
    white-space: pre-wrap;
    z-index: 20;
    user-select: text;
    -webkit-user-select: text;
  }

  @media (max-width: 380px) {
    .chip { font-size: 12px; padding: 0 12px; }
    #title { font-size: 10px; }
  }
</style>
</head>
<body>
<header>
  <p id="title">Brewery Art Walk · 108 artists · 35 buildings</p>
  <input type="search" id="search" placeholder="Search artists, mediums, addresses" autocomplete="off" autocapitalize="none" spellcheck="false">
</header>

<nav id="chips" aria-label="Filter by category"></nav>

<main id="map-container">
  <svg id="map" viewBox="0 0 1019 913" role="img" aria-label="Brewery Art Colony campus map" preserveAspectRatio="xMidYMid meet">
    <defs>
      <pattern id="diag" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#ddd" stroke-width="1"/>
      </pattern>
    </defs>
  </svg>
  <div id="status" aria-live="polite">Loading…</div>
  <div id="zoom-controls">
    <button id="zoom-in" aria-label="Zoom in">+</button>
    <button id="zoom-out" aria-label="Zoom out">−</button>
    <button id="zoom-reset" aria-label="Reset zoom">⟲</button>
  </div>
</main>

<aside id="sheet" role="region" aria-label="Details" aria-hidden="true">
  <div id="sheet-handle" aria-hidden="true"></div>
  <button id="sheet-close" aria-label="Close">×</button>
  <div id="sheet-body"></div>
</aside>

  // -------- ViewBox / zoom --------
  const NATURAL = { w: 1019, h: 913 };
  const VIEW = { x: 0, y: 0, w: NATURAL.w, h: NATURAL.h };
  const MIN_W = 120;                        // most zoomed in
  const MAX_W = NATURAL.w * 1.4;            // most zoomed out
  let suppressClick = false;

  // -------- State --------
  let artists = [];
  let buildings = [];
  let categories = [];
  let activeFilters = new Set();
  let selectedAddress = null;
  let searchQuery = '';
  let artistsByAddress = {};

  // -------- Data load --------
  // Inline data is base64-encoded JSON in window.__ARTISTS_B64__ / __BUILDINGS_B64__
  // (populated by `node prepare.js`). Base64 dodges any HTML-parser issues with
  // bio text that contains <, >, </script, etc. Falls back to fetch if empty.
  function loadInlineB64(globalKey) {
    const b64 = window[globalKey];
    if (!b64 || typeof b64 !== 'string') return null;
    try {
      // atob -> binary string (Latin-1). The JSON is UTF-8, so decode bytes
      // properly via TextDecoder, otherwise curly quotes / em dashes / accented
      // characters in bios will mangle JSON.parse.
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const json = new TextDecoder('utf-8').decode(bytes);
      const data = JSON.parse(json);
      return Array.isArray(data) && data.length > 0 ? data : null;
    } catch (e) { console.error('inline data parse:', e); return null; }
  }
  function loadJSON(path) {
    return fetch(path, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error(`${path} → HTTP ${r.status}`);
      return r.json();
    });
  }

  artists = loadInlineB64('__ARTISTS_B64__');
  buildings = loadInlineB64('__BUILDINGS_B64__');

  if (!artists || !buildings) {
    try {
      const [a, b] = await Promise.all([
        loadJSON('artists.json'),
        loadJSON('buildings.json'),
      ]);
      artists = a;
      buildings = b;
    } catch (e) {
      showError('Cannot load data:\n' + e.message + '\n\nRun `node prepare.js` to inline the JSON, or serve over HTTP:\n  python3 -m http.server 8000');
      return;
    }
  }

  categories = [...new Set(artists.map(x => x.category).filter(Boolean))].sort();
  artistsByAddress = {};
  artists.forEach(x => {
    (artistsByAddress[x.address] = artistsByAddress[x.address] || []).push(x);
  });

  // -------- Render chips --------
  function renderChips() {
    chipsBar.innerHTML = '';
    const all = makeChip('All', '', activeFilters.size === 0);
    chipsBar.appendChild(all);
    categories.forEach(cat => chipsBar.appendChild(makeChip(cat, cat, activeFilters.has(cat))));
  }
  function makeChip(label, cat, active) {
    const b = document.createElement('button');
    b.className = 'chip' + (active ? ' active' : '');
    b.textContent = label;
    b.dataset.cat = cat;
    b.addEventListener('click', () => {
      if (cat === '') {
        activeFilters.clear();
      } else {
        if (activeFilters.has(cat)) activeFilters.delete(cat);
        else activeFilters.add(cat);
      }
      renderChips();
      applyFilters();
    });
    return b;
  }

  // -------- Render map --------
  // Overlay modes drop the printed campus map translucent under the SVG so
  // building rects can be aligned by eye. The SVG viewBox matches both
  // reference images 1:1 (1019×913), so OVERLAY is just the full image.
  //   ?overlay=1     → labeled greyscale (default, shows addresses + units)
  //   ?overlay=bw    → black silhouette only
  const OVERLAY = { x: 0, y: 0, width: 1019, height: 913 };
  const overlayParam = new URLSearchParams(location.search).get('overlay');
  const overlayMode = overlayParam !== null;
  const OVERLAY_SRC = overlayParam === 'bw' ? 'bw map.jpg' : 'map_greyscale.jpg';
  if (overlayMode) document.body.classList.add('overlay-mode');

  function renderMap() {
    while (svg.lastChild && svg.lastChild.tagName !== 'defs') svg.removeChild(svg.lastChild);

    // Streets — light grey strips, no labels needed (the building number
    // alone identifies each address).
    const streetsG = el('g', { id: 'streets' });
    streetsG.appendChild(el('rect', { class: 'street-strip', x: 0,   y: 0,  width: 1019, height: 60 }));
    streetsG.appendChild(el('rect', { class: 'street-strip', x: 950, y: 60, width: 69,  height: 853 }));
    streetsG.appendChild(el('polygon', { class: 'street-strip', points: '0,60 185,60 75,740 0,740' }));
    svg.appendChild(streetsG);

    // Buildings — visible rectangles, one per address.
    // No artist-count badges (per request) — just the number.
    const buildingsG = el('g', { id: 'buildings' });
    Object.entries(POSITIONS).forEach(([addr, pos]) => {
      const g = el('g', { class: 'bld-group', 'data-address': addr });

      if (pos.parts && pos.parts.length) {
        pos.parts.forEach(part => {
          let pe;
          if (part.type === 'rect' || (part.x != null && part.w != null && part.type == null)) {
            pe = el('rect', { class: 'bld-rect', x: part.x, y: part.y, width: part.w, height: part.h });
          } else if (part.type === 'polygon' || part.type === 'polyline') {
            pe = el(part.type, { class: 'bld-rect', points: part.points });
          } else if (part.type === 'path') {
            pe = el('path', { class: 'bld-rect', d: part.d });
          }
          if (pe) g.appendChild(pe);
        });
      } else {
        g.appendChild(el('rect', {
          class: 'bld-rect', x: pos.x, y: pos.y, width: pos.w, height: pos.h
        }));
      }
      g.appendChild(textEl(pos.short, pos.x + pos.w / 2, pos.y + pos.h / 2 + 4, 'bld-label'));

      g.addEventListener('click', () => {
        if (suppressClick) return;
        onBuildingTap(addr);
      });

      buildingsG.appendChild(g);
    });
    svg.appendChild(buildingsG);
  }

  function el(name, attrs) {
    const e = document.createElementNS(NS, name);
    if (attrs) for (const k in attrs) {
      if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    return e;
  }
  function textEl(text, x, y, cls, extra) {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    if (cls) t.setAttribute('class', cls);
    if (extra) for (const k in extra) t.setAttribute(k, extra[k]);
    if (!extra || !('text-anchor' in extra)) t.setAttribute('text-anchor', 'middle');
    t.textContent = text;
    return t;
  }

  // -------- Filter / search application --------
  function matchesFilter(a) {
    return activeFilters.size === 0 || activeFilters.has(a.category);
  }
  function matchesSearch(a) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (a.name && a.name.toLowerCase().includes(q)) ||
           (a.medium && a.medium.toLowerCase().includes(q)) ||
           (a.address && a.address.toLowerCase().includes(q)) ||
           (a.category && a.category.toLowerCase().includes(q));
  }

  function applyFilters() {
    let total = 0;
    const filterActive = activeFilters.size > 0 || !!searchQuery;
    Object.entries(POSITIONS).forEach(([addr]) => {
      const arts = artistsByAddress[addr] || [];
      const matching = arts.filter(a => matchesFilter(a) && matchesSearch(a));
      total += matching.length;
      const g = svg.querySelector(`g.bld-group[data-address="${cssEscape(addr)}"]`);
      if (!g) return;
      const isAny = matching.length > 0;
      g.classList.toggle('dim', filterActive && !isAny);
      const badge = g.querySelector('text.badge-text');
      const circ = g.querySelector('circle.badge-circle');
      if (badge && circ) {
        badge.textContent = matching.length;
        badge.classList.toggle('badge-hidden', matching.length === 0);
        circ.classList.toggle('badge-hidden', matching.length === 0);
      }
    });
    status.textContent = `Showing ${total} of ${artists.length} artists`;
    if (searchQuery && !selectedAddress) {
      const matches = artists.filter(a => matchesFilter(a) && matchesSearch(a));
      showSearchResults(matches);
    }
  }

  function cssEscape(s) {
    return String(s).replace(/(["\\])/g, '\\$1');
  }

  // -------- Tap handlers --------
  function onBuildingTap(addr) {
    selectedAddress = addr;
    highlightBuilding(addr);
    showBuildingArtists(addr);
    if (currentZoomLevel() < 2) zoomTo(addr);
  }
  function highlightBuilding(addr) {
    svg.querySelectorAll('g.bld-group').forEach(g => {
      g.classList.toggle('selected', g.dataset.address === addr);
    });
  }
  function clearHighlight() {
    svg.querySelectorAll('g.bld-group.selected').forEach(g => g.classList.remove('selected'));
  }

  // -------- Bottom sheet --------
  function openSheet(html) {
    sheetBody.innerHTML = html;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    sheet.scrollTop = 0;
  }
  function closeSheet() {
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    selectedAddress = null;
    clearHighlight();
  }
  sheetClose.addEventListener('click', closeSheet);

  // Trim verbose suffixes for display: "1984 N. Main Street" → "1984 N. Main",
  // "650 South Avenue 21" → "650 S. Ave 21", "600 Moulton Avenue" → "600 Moulton".
  function prettyAddr(addr) {
    if (!addr) return '';
    return String(addr)
      .replace(/\bStreet\b/g, '')
      .replace(/\bSouth Avenue 21\b/g, 'S. Ave 21')
      .replace(/\bMoulton Avenue\b/g, 'Moulton')
      .replace(/\bAvenue\b/g, 'Ave')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function showBuildingArtists(addr) {
    const arts = (artistsByAddress[addr] || []).filter(a => matchesFilter(a) && matchesSearch(a));
    const html = `
      <div class="building-head">${esc(prettyAddr(addr))}</div>
      <h2>${arts.length} ${arts.length === 1 ? 'artist' : 'artists'}</h2>
      ${arts.length === 0
        ? '<p class="empty">No artists match the current filter.</p>'
        : '<ul class="artist-list">' + arts.map(a => `
            <li><button data-artist-idx="${artists.indexOf(a)}">
              <div class="a-name">${esc(a.name)}</div>
              <div class="a-meta">${esc(a.category)}${a.medium ? ' · ' + esc(a.medium) : ''}${a.unit ? ' · #' + esc(a.unit) : ''}</div>
            </button></li>`).join('') + '</ul>'}`;
    openSheet(html);
    bindArtistButtons(addr);
  }

  function bindArtistButtons(returnAddr) {
    sheetBody.querySelectorAll('button[data-artist-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const a = artists[parseInt(btn.dataset.artistIdx, 10)];
        showArtistDetail(a, returnAddr);
      });
    });
  }

  function showArtistDetail(a, returnAddr) {
    const links = [];
    if (a.website)     links.push(`<a href="${esc(a.website)}" target="_blank" rel="noopener">Website</a>`);
    if (a.instagram)   links.push(`<a href="${esc(a.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
    if (a.profile_url) links.push(`<a href="${esc(a.profile_url)}" target="_blank" rel="noopener">Profile</a>`);
    if (a.other_links) a.other_links.forEach(l => links.push(`<a href="${esc(l)}" target="_blank" rel="noopener">${esc(displayHost(l))}</a>`));

    const html = `
      ${returnAddr ? `<button class="back-btn" id="back-to-list">← Back to ${esc(POSITIONS[returnAddr] ? (POSITIONS[returnAddr].short) : prettyAddr(returnAddr))}</button>` : ''}
      <div class="building-head">${esc(prettyAddr(a.address))}${a.unit ? ' · Unit ' + esc(a.unit) : ''}</div>
      <h2>${esc(a.name)}</h2>
      <div class="meta">${esc(a.category)}${a.medium ? ' · ' + esc(a.medium) : ''}</div>
      ${a.images && a.images.length ? `<img class="thumb" src="${esc(a.images[0])}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
      ${a.bio ? `<div class="bio">${esc(a.bio)}</div>` : ''}
      ${links.length ? '<div class="links">' + links.join('') + '</div>' : ''}`;
    openSheet(html);
    const back = sheetBody.querySelector('#back-to-list');
    if (back) back.addEventListener('click', () => showBuildingArtists(returnAddr));
  }

  function showSearchResults(matches) {
    if (matches.length === 0) {
      openSheet('<h2>No matches</h2><p class="empty">Try a different search term.</p>');
      return;
    }
    const html = `
      <h2>${matches.length} ${matches.length === 1 ? 'result' : 'results'}</h2>
      <ul class="artist-list">
        ${matches.slice(0, 200).map(a => `
          <li><button data-artist-idx="${artists.indexOf(a)}">
            <div class="a-name">${esc(a.name)}</div>
            <div class="a-meta">${esc(a.category)} · ${esc(prettyAddr(a.address))}${a.unit ? ' #' + esc(a.unit) : ''}</div>
          </button></li>`).join('')}
      </ul>`;
    openSheet(html);
    sheetBody.querySelectorAll('button[data-artist-idx]').forEach(btn => {
      btn.addEventListener('click', () => {
        const a = artists[parseInt(btn.dataset.artistIdx, 10)];
        zoomTo(a.address);
        selectedAddress = a.address;
        highlightBuilding(a.address);
        showArtistDetail(a, a.address);
      });
    });
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function displayHost(url) {
    try { return new URL(url).host.replace(/^www\./, ''); }
    catch { return url; }
  }

  // -------- Pan / zoom --------
  function setView(x, y, w) {
    w = Math.max(MIN_W, Math.min(MAX_W, w));
    const aspectMap = NATURAL.h / NATURAL.w;
    const containerRect = svg.getBoundingClientRect();
    const aspectScreen = containerRect.height / containerRect.width;
    const h = w * aspectScreen;
    const overshoot = Math.max(NATURAL.w, NATURAL.h) * 0.15;
    x = Math.max(-overshoot, Math.min(NATURAL.w + overshoot - w, x));
    y = Math.max(-overshoot, Math.min(NATURAL.h + overshoot - h, y));
    VIEW.x = x; VIEW.y = y; VIEW.w = w; VIEW.h = h;
    svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
    updateZoomLevel();
  }
  function currentZoomLevel() {
    const z = NATURAL.w / VIEW.w;
    if (z < 1.8) return 1;
    if (z < 4) return 2;
    return 3;
  }
  function updateZoomLevel() {
    const lvl = currentZoomLevel();
    svg.querySelectorAll('text.bld-name').forEach(t => t.classList.toggle('hidden', lvl < 2));
  }
  function zoomTo(addr) {
    const pos = POSITIONS[addr];
    if (!pos) return;
    const cx = pos.x + pos.w / 2;
    const cy = pos.y + pos.h / 2;
    const targetW = Math.max(pos.w * 4.5, 320);
    const containerRect = svg.getBoundingClientRect();
    const aspectScreen = containerRect.height / containerRect.width;
    const targetH = targetW * aspectScreen;
    setView(cx - targetW / 2, cy - targetH / 2, targetW);
  }
  function resetView() {
    const containerRect = svg.getBoundingClientRect();
    const aspectScreen = containerRect.height / containerRect.width;
    const w = aspectScreen >= NATURAL.h / NATURAL.w ? NATURAL.w : NATURAL.h / aspectScreen;
    setView((NATURAL.w - w) / 2, 0, w);
  }

  // Mouse + touch interactions
  let isPanning = false;
  let panStart = null;
  let panStartView = null;
  let pinchStartDist = 0;
  let pinchStartView = null;
  let pinchStartFocus = null;
  let touchMoved = false;

  svg.addEventListener('mousedown', e => {
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    panStartView = { ...VIEW };
    touchMoved = false;
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!isPanning) return;
    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) touchMoved = true;
    const rect = svg.getBoundingClientRect();
    const sx = panStartView.w / rect.width;
    const sy = panStartView.h / rect.height;
    setView(panStartView.x - dx * sx, panStartView.y - dy * sy, panStartView.w);
  });
  window.addEventListener('mouseup', () => {
    if (touchMoved) { suppressClick = true; setTimeout(() => suppressClick = false, 80); }
    isPanning = false;
  });

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    const fx = VIEW.x + px * VIEW.w;
    const fy = VIEW.y + py * VIEW.h;
    const newW = VIEW.w / factor;
    const aspectScreen = rect.height / rect.width;
    const newH = newW * aspectScreen;
    setView(fx - px * newW, fy - py * newH, newW);
  }, { passive: false });

  svg.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      isPanning = true;
      panStart = { x: t.clientX, y: t.clientY };
      panStartView = { ...VIEW };
      touchMoved = false;
    } else if (e.touches.length === 2) {
      isPanning = false;
      const t1 = e.touches[0], t2 = e.touches[1];
      pinchStartDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      pinchStartView = { ...VIEW };
      const rect = svg.getBoundingClientRect();
      const midX = (t1.clientX + t2.clientX) / 2;
      const midY = (t1.clientY + t2.clientY) / 2;
      const px = (midX - rect.left) / rect.width;
      const py = (midY - rect.top) / rect.height;
      pinchStartFocus = { px, py };
    }
  }, { passive: true });
  svg.addEventListener('touchmove', e => {
    if (e.touches.length === 1 && isPanning) {
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - panStart.x;
      const dy = t.clientY - panStart.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) touchMoved = true;
      const rect = svg.getBoundingClientRect();
      const sx = panStartView.w / rect.width;
      const sy = panStartView.h / rect.height;
      setView(panStartView.x - dx * sx, panStartView.y - dy * sy, panStartView.w);
    } else if (e.touches.length === 2 && pinchStartView) {
      e.preventDefault();
      const t1 = e.touches[0], t2 = e.touches[1];
      const d = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      const factor = d / pinchStartDist || 1;
      const newW = pinchStartView.w / factor;
      const fx = pinchStartView.x + pinchStartFocus.px * pinchStartView.w;
      const fy = pinchStartView.y + pinchStartFocus.py * pinchStartView.h;
      const rect = svg.getBoundingClientRect();
      const aspectScreen = rect.height / rect.width;
      const newH = newW * aspectScreen;
      setView(fx - pinchStartFocus.px * newW, fy - pinchStartFocus.py * newH, newW);
      touchMoved = true;
    }
  }, { passive: false });
  svg.addEventListener('touchend', () => {
    if (touchMoved) { suppressClick = true; setTimeout(() => suppressClick = false, 80); }
    isPanning = false;
    pinchStartView = null;
  });

  // Zoom buttons
  $('#zoom-in').addEventListener('click', () => {
    setView(VIEW.x + VIEW.w * 0.18, VIEW.y + VIEW.h * 0.18, VIEW.w * 0.6);
  });
  $('#zoom-out').addEventListener('click', () => {
    setView(VIEW.x - VIEW.w * 0.33, VIEW.y - VIEW.h * 0.33, VIEW.w * 1.6);
  });
  $('#zoom-reset').addEventListener('click', () => {
    resetView();
    closeSheet();
    search.value = '';
    searchQuery = '';
    activeFilters.clear();
    renderChips();
    applyFilters();
  });

  // Search input
  let searchTimer = null;
  search.addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      applyFilters();
      if (!searchQuery && !selectedAddress) closeSheet();
    }, 100);
  });
  search.addEventListener('focus', () => {
    if (searchQuery) showSearchResults(artists.filter(a => matchesFilter(a) && matchesSearch(a)));
  });

  // Resize handler
  window.addEventListener('resize', () => setView(VIEW.x, VIEW.y, VIEW.w));
  window.addEventListener('orientationchange', () => setTimeout(() => setView(VIEW.x, VIEW.y, VIEW.w), 100));

  // -------- Init --------
  function showError(msg) {
    const el = document.createElement('div');
    el.id = 'error-banner';
    el.textContent = msg;
    mapContainer.appendChild(el);
    status.textContent = '';
  }

  renderChips();
  renderMap();
  resetView();
  applyFilters();
})();
</script>
</body>
</html>
