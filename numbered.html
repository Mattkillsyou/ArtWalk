<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Template — numbered shapes</title>
<style>
  body { margin: 0; padding: 16px; font-family: -apple-system, system-ui, sans-serif; background: #fafafa; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  .legend { font: 12px monospace; margin-bottom: 12px; }
  .legend span { display: inline-block; padding: 2px 8px; margin-right: 8px; border: 1px solid #000; }
  .red   { color: #d00; }
  .green { color: #060; }
  #map { display: block; max-width: 100%; height: auto; border: 1px solid #000; background: #fff; }
  .label-bg { fill: #fff; stroke: #000; stroke-width: 0.5; }
  .label-r { fill: #d00; font: bold 11px monospace; text-anchor: middle; dominant-baseline: central; }
  .label-g { fill: #060; font: bold 9px monospace; text-anchor: middle; dominant-baseline: central; }
  table { font: 11px monospace; margin-top: 16px; border-collapse: collapse; }
  th, td { padding: 4px 8px; border-bottom: 1px solid #ccc; text-align: left; }
  th { background: #eee; }
</style>
</head>
<body>
<h1>Template shapes — index map</h1>
<p class="legend">
  <span class="red">R# = RED outline (building footprint)</span>
  <span class="green">G# = GREEN section (addressable unit)</span>
</p>
<svg id="map" viewBox="0 0 1019 913" xmlns="http://www.w3.org/2000/svg">
  <image href="map_greyscale.jpg" x="0" y="0" width="1019" height="913" opacity="0.4"/>
  <g id="overlay-shapes"></g>
  <g id="labels"></g>
</svg>
<table id="catalog">
  <thead><tr><th>idx</th><th>color</th><th>tag</th><th>x</th><th>y</th><th>w</th><th>h</th></tr></thead>
  <tbody></tbody>
</table>
<script>
fetch('template-shapes.json').then(r => r.json()).then(({shapes, byCat}) => {
  const svg = document.getElementById('map');
  const NS = 'http://www.w3.org/2000/svg';
  const overlay = document.getElementById('overlay-shapes');
  const labelsG = document.getElementById('labels');
  const tbody = document.querySelector('#catalog tbody');

  // The parser already filtered to on-canvas shapes — show them all here,
  // rendering the ORIGINAL geometry (polygon / path / rect / line) so we
  // see the real building outline, not just its bounding box.
  let redIdx = 0, greenIdx = 0, blueIdx = 0;
  shapes.forEach(s => {
    if (!['red', 'green', 'blue'].includes(s.category)) return;
    const cat = s.category;
    const idx = cat === 'red' ? redIdx++ : cat === 'green' ? greenIdx++ : blueIdx++;
    const tag = (cat === 'red' ? 'R' : cat === 'green' ? 'G' : 'B') + idx;
    const isRed = cat === 'red', isBlue = cat === 'blue';
    const stroke = isRed ? '#d00' : isBlue ? '#00a' : '#060';
    let el;
    const g = s.geom || { type: 'rect', x: s.bbox.x, y: s.bbox.y, w: s.bbox.w, h: s.bbox.h };
    if (g.type === 'rect') {
      el = document.createElementNS(NS, 'rect');
      el.setAttribute('x', g.x); el.setAttribute('y', g.y);
      el.setAttribute('width', g.w); el.setAttribute('height', g.h);
    } else if (g.type === 'polygon' || g.type === 'polyline') {
      el = document.createElementNS(NS, g.type);
      el.setAttribute('points', g.points);
    } else if (g.type === 'path') {
      el = document.createElementNS(NS, 'path');
      el.setAttribute('d', g.d);
    } else if (g.type === 'line') {
      el = document.createElementNS(NS, 'line');
      el.setAttribute('x1', g.x1); el.setAttribute('y1', g.y1);
      el.setAttribute('x2', g.x2); el.setAttribute('y2', g.y2);
    }
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', '1.6');
    if (isBlue) el.setAttribute('stroke-dasharray', '6 4');
    overlay.appendChild(el);
    const cx = s.bbox.x + s.bbox.w / 2;
    const cy = s.bbox.y + s.bbox.h / 2;
    const bg = document.createElementNS(NS, 'rect');
    bg.setAttribute('class', 'label-bg');
    bg.setAttribute('x', cx - 14);
    bg.setAttribute('y', cy - 8);
    bg.setAttribute('width', 28);
    bg.setAttribute('height', 16);
    labelsG.appendChild(bg);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', isRed ? 'label-r' : 'label-g');
    if (isBlue) t.setAttribute('fill', '#00a');
    t.setAttribute('x', cx);
    t.setAttribute('y', cy);
    t.textContent = tag;
    labelsG.appendChild(t);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${tag}</td><td>${s.category}</td><td>${s.tag}</td><td>${Math.round(s.bbox.x)}</td><td>${Math.round(s.bbox.y)}</td><td>${Math.round(s.bbox.w)}</td><td>${Math.round(s.bbox.h)}</td>`;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
