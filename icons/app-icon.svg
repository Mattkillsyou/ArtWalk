  <g transform="translate(-5 -26)">
    <path d="M652 380 A 168 120 0 0 1 652 620" fill="none" stroke="#000000" stroke-width="66" stroke-linecap="round"/>
    <polygon points="300,235 660,235 644,836 634,858 612,872 598,873 362,873 348,872 326,858 316,836" fill="#000000"/>
    <polygon points="480,419 590,689 480,635 370,689" fill="#FFFFFF"/>
  </g>
</svg>
