<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture building coordinates</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; background: #fafafa; color: #111; }
  body { display: flex; height: 100vh; overflow: hidden; }
  #side {
    flex: 0 0 320px;
    background: #fff;
    border-right: 1px solid #000;
    display: flex;
    flex-direction: column;
  }
  #side-head {
    padding: 12px;
    border-bottom: 1px solid #000;
    background: #f5f5f5;
  }
  #side-head h1 { margin: 0 0 6px; font-size: 14px; }
  #side-head p { margin: 0; font: 11px/1.4 ui-monospace, monospace; color: #555; }
  #addr-list {
    flex: 1 1 auto;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #addr-list li {
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    font: 12px/1.4 ui-monospace, monospace;
    display: flex;
    justify-content: space-between;
  }
  #addr-list li:hover { background: #f0f0f0; }
  #addr-list li.active { background: #000; color: #fff; }
  #addr-list li.done { color: #060; }
  #addr-list li.done::after { content: '✓'; }
  #addr-list li.active::after { content: '◆'; }
  #side-foot {
    padding: 10px 12px;
    border-top: 1px solid #000;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #side-foot button {
    height: 36px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    font: 12px/1 inherit;
    cursor: pointer;
  }
  #side-foot button:hover { background: #000; color: #fff; }
  #status {
    font: 11px/1.3 ui-monospace, monospace;
    color: #555;
    padding: 4px 0;
    min-height: 28px;
  }
  #map-wrap {
    flex: 1 1 auto;
    overflow: auto;
    padding: 16px;
    background: #fafafa;
  }
  #stage {
    position: relative;
    display: inline-block;
    box-shadow: 0 0 0 1px #000;
  }
  #map-img {
    display: block;
    max-width: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    cursor: crosshair;
    pointer-events: auto;
  }
  .marker {
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid red;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .rect {
    position: absolute;
    border: 2px solid red;
    background: rgba(255, 0, 0, 0.08);
    pointer-events: none;
    font: bold 11px ui-monospace, monospace;
    color: red;
    padding: 2px 4px;
    line-height: 1;
  }
  .rect.done { border-color: #060; color: #060; background: rgba(0, 100, 0, 0.06); }
  textarea {
    width: 100%;
    min-height: 120px;
    font: 11px ui-monospace, monospace;
    border: 1px solid #000;
    padding: 8px;
    resize: vertical;
  }
</style>
</head>
<body>

<aside id="side">
  <div id="side-head">
    <h1>Capture building positions <span id="progress" style="float:right; font:11px ui-monospace; color:#555;">0/0</span></h1>
    <p><b>Rect:</b> click NW corner, then SE corner.<br><b>Polygon:</b> click each vertex, then "Finish".<br>Pick mode below, then pick an address.</p>
    <div style="margin-top:8px; display:flex; gap:6px;">
      <label style="font:11px ui-monospace; cursor:pointer;"><input type="radio" name="mode" value="rect" checked> Rect (2 clicks)</label>
      <label style="font:11px ui-monospace; cursor:pointer;"><input type="radio" name="mode" value="polygon"> Polygon</label>
    </div>
    <input id="search" type="search" placeholder="filter addresses…" autocomplete="off"
           style="margin-top:8px; width:100%; height:30px; padding:0 8px; border:1px solid #000; font:12px ui-monospace, monospace;">
    <div style="margin-top:6px; display:flex; gap:6px;">
      <button id="show-pending" style="flex:1; height:26px; border:1px solid #000; background:#fff; font:11px ui-monospace; cursor:pointer;">Show pending only</button>
      <label style="flex:0 0 auto; height:26px; line-height:26px; padding:0 8px; border:1px solid #000; cursor:pointer; font:11px ui-monospace;">
        Load JSON
        <input id="load-file" type="file" accept=".json" style="display:none;">
      </label>
    </div>
  </div>
  <ul id="addr-list"></ul>
  <div id="side-foot">
    <div id="status">Pick an address.</div>
    <button id="finish-btn" style="display:none; background:#000; color:#fff;">Finish polygon</button>
    <button id="undo-btn" style="display:none;">Undo last vertex</button>
    <button id="reset-one-btn">Reset selected address</button>
    <button id="copy-btn">Copy POSITIONS as JS</button>
    <button id="save-btn">Download positions.json</button>
    <button id="reset-btn" style="background:#fee;">Reset all</button>
  </div>
</aside>

<main id="map-wrap">
  <div id="stage">
    <img id="map-img" src="map_greyscale.jpg" alt="">
    <div id="overlay"></div>
  </div>
</main>

<script>
// Parse a buildings.json `units` string into a list of unit identifiers.
// Handles ranges (A-F, 1-10, A1-A15, 200-218, E18-E30), comma-separated
// lists, and parenthetical / labelled tokens like "East: E18-E30+,
// West: W5-W17" or "406A-407 (top level)".
function parseUnits(unitsStr) {
  if (!unitsStr) return [];
  let s = unitsStr.replace(/\s*\([^)]*\)/g, '');
  s = s.replace(/[A-Za-z]+:\s*/g, '');
  s = s.replace(/\bplus\s+(?:ground|top)\s+units?\s*/gi, '');
  s = s.replace(/\+/g, '');
  const parts = s.split(/[,/]\s*/).map(p => p.trim()).filter(Boolean);
  const MAX_RANGE = 30;   // bigger than this is almost certainly a floor designator like "101-500"
  const units = [];
  for (const part of parts) {
    const m = part.match(/^([A-Za-z]*)(\d+)-([A-Za-z]*)(\d+)$/);
    if (m) {
      const [, p1, n1, p2, n2] = m;
      const prefix = p1 || p2;
      if (p1 === p2 || !p1 || !p2) {
        const lo = parseInt(n1, 10), hi = parseInt(n2, 10);
        if (hi - lo + 1 <= MAX_RANGE) {
          for (let i = lo; i <= hi; i++) units.push(prefix + i);
        }
        // Bigger ranges (>30) skip entirely — those are typically floor
        // designators ("101-500" = 400 rooms) and the building should be
        // captured as one shape via NO_SUBDIVIDE.
        continue;
      }
    }
    const lm = part.match(/^([A-Za-z])-([A-Za-z])$/);
    if (lm) {
      for (let c = lm[1].charCodeAt(0); c <= lm[2].charCodeAt(0); c++) units.push(String.fromCharCode(c));
      continue;
    }
    // Unparseable mixed range like "406A-407" — split on dash, include both ends.
    if (/^[A-Za-z0-9]+-[A-Za-z0-9]+$/.test(part)) {
      const [lo, hi] = part.split('-');
      if (lo) units.push(lo.trim());
      if (hi) units.push(hi.trim());
      continue;
    }
    if (part) units.push(part);
  }
  return units;
}

// Parent addresses — generated dynamically below from buildings.json + the
// official program's extras (614/616 Moulton, 642 split, the 621 orphan).
let ADDRESSES = [
  // North Main Street row (W → E)
  "1910 N. Main Street",
  "1918 N. Main Street",
  "1920 N. Main Street",
  "1930 N. Main Street",
  "1940 N. Main Street",
  "1950 N. Main Street",
  "1960 N. Main Street",
  "1980 N. Main Street",
  "1984 N. Main Street",
  "2020 N. Main Street",
  "2100 N. Main Street",

  // Moulton Avenue (number ascending)
  "600 Moulton Avenue",
  "602 Moulton Avenue",
  "604 Moulton Avenue",
  "610 Moulton Avenue",
  "612 Moulton Avenue",
  "614 Moulton Avenue",
  "616 Moulton Avenue",
  "618 Moulton Avenue",
  "620 Moulton Avenue",
  "622 Moulton Avenue",
  "624 Moulton Avenue",
  "626 Moulton Avenue",
  "630-638 Moulton Avenue",   // single vertical strip on the printed map
  "630 Moulton Avenue",
  "632 Moulton Avenue",
  "634 Moulton Avenue",
  "636 Moulton Avenue",
  "638 Moulton Avenue",
  "642 Moulton Avenue (West)",
  "642 Moulton Avenue (East)",
  "645 Moulton Avenue",
  "650 Moulton Avenue",
  "670 Moulton Avenue",
  "690 Moulton Avenue",
  "692 Moulton Avenue",
  "696 Moulton Avenue",

  // South Avenue 21
  "621 Avenue 21",
  "650 South Avenue 21",
  "660 South Avenue 21",
  "672 South Avenue 21",
  "676 South Avenue 21",
];

// Buildings whose `units` field describes unit NUMBERS but the building is
// drawn as one block on the printed map (no separately-rendered cells).
// These are captured as a single shape; we don't append "#unit" sub-units.
const NO_SUBDIVIDE = new Set([
  "600 Moulton Avenue",        // 101-500 = floor designations, one block
  "620 Moulton Avenue",        // 200-218 inside one block
  "660 South Avenue 21",       // 1-10 inside one block
  "672 South Avenue 21",       // 1-8 inside one block
  "676 South Avenue 21",       // 33, 200, 300, 400 = floor designations
  "1918 N. Main Street",       // 101-104, 201-205 inside one block
  "1984 N. Main Street",       // 200-500 = floor designations
  // 2020 N. Main DOES subdivide — its "220-244" cells are drawn separately
  // on the printed map (per user). Keep out of this list.
  "2100 N. Main Street",       // Atrium A1-A15 / B1-B15 — one building
]);

// Append sub-units from buildings.json's `units` field. Each becomes
// "<address> #<unit>" — e.g. "618 Moulton Avenue #A", "2100 N. Main Street #A1",
// "642 Moulton Avenue #E18". Parents come first, sub-units after, so the
// search filter is the practical way to navigate (e.g. type "642").
fetch('buildings.json?v=' + Date.now()).then(r => r.json()).then(buildings => {
  // 1. Pull in any building address from data that's not in the hardcoded
  //    parent list yet (so adding to buildings.json automatically shows up
  //    in the capture tool — e.g. "670 South Avenue 21", "688 Moulton").
  const newParents = [];
  for (const b of buildings) {
    if (!ADDRESSES.includes(b.address)) {
      newParents.push(b.address);
      ADDRESSES.push(b.address);
    }
  }

  // 2. Append sub-units for buildings whose units field is meaningful.
  const subs = [];
  for (const b of buildings) {
    if (NO_SUBDIVIDE.has(b.address)) continue;
    const u = parseUnits(b.units);
    for (const unit of u) subs.push(`${b.address} #${unit}`);
  }
  ADDRESSES = [...ADDRESSES, ...subs];

  renderList();
  console.log(`expanded to ${ADDRESSES.length} addresses (+${newParents.length} new parents, +${subs.length} sub-units)`);
}).catch(err => {
  console.warn('failed to load buildings.json — sub-units not expanded:', err);
});

const positions = {};   // addr → { x, y, w, h, type, points }
let active = null;
let pending = null;     // first click in rect mode
let polyVerts = [];     // accumulating polygon vertices for current address
let mode = 'rect';      // 'rect' or 'polygon'

document.querySelectorAll('input[name="mode"]').forEach(r => {
  r.addEventListener('change', e => {
    mode = e.target.value;
    pending = null;
    polyVerts = [];
    document.getElementById('finish-btn').style.display = mode === 'polygon' ? '' : 'none';
    document.getElementById('undo-btn').style.display   = mode === 'polygon' ? '' : 'none';
    if (active) selectAddress(active);
  });
});

document.getElementById('finish-btn').addEventListener('click', finishPolygon);
document.getElementById('undo-btn').addEventListener('click', () => {
  polyVerts.pop();
  renderShapes();
  status.textContent = polyVerts.length === 0
    ? `Click vertices for "${active}".`
    : `${polyVerts.length} vertices. Keep clicking, then Finish.`;
});

const list = document.getElementById('addr-list');
const status = document.getElementById('status');
const overlay = document.getElementById('overlay');
const stage = document.getElementById('stage');
const img = document.getElementById('map-img');

// Pre-load to size the overlay correctly.
img.addEventListener('load', () => {
  // Display at intrinsic 1019×913 size — coords are in image pixels.
  console.log('map loaded:', img.naturalWidth, 'x', img.naturalHeight);
});

let searchQuery = '';
let pendingOnly = false;

function renderList() {
  list.innerHTML = '';
  const q = searchQuery.toLowerCase();
  let shown = 0;
  for (const addr of ADDRESSES) {
    if (q && !addr.toLowerCase().includes(q)) continue;
    if (pendingOnly && positions[addr]) continue;
    shown++;
    const li = document.createElement('li');
    li.textContent = addr;
    if (addr === active) li.classList.add('active');
    if (positions[addr]) li.classList.add('done');
    li.addEventListener('click', () => selectAddress(addr));
    list.appendChild(li);
  }
  if (shown === 0) {
    const li = document.createElement('li');
    li.textContent = '(no matches)';
    li.style.color = '#999';
    li.style.cursor = 'default';
    list.appendChild(li);
  }
  const done = Object.keys(positions).length;
  document.getElementById('progress').textContent = `${done}/${ADDRESSES.length}`;
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderList();
});
document.getElementById('show-pending').addEventListener('click', () => {
  pendingOnly = !pendingOnly;
  document.getElementById('show-pending').textContent = pendingOnly ? 'Show all' : 'Show pending only';
  renderList();
});
document.getElementById('load-file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    let loaded = 0;
    for (const [addr, p] of Object.entries(data)) {
      if (!ADDRESSES.includes(addr)) continue;
      positions[addr] = p;
      loaded++;
    }
    status.textContent = `Loaded ${loaded} positions from ${f.name}.`;
    // resume on first pending address
    const next = ADDRESSES.find(a => !positions[a]);
    if (next) selectAddress(next);
    else { active = null; renderList(); renderShapes(); }
  } catch (err) {
    status.textContent = 'Error loading JSON: ' + err.message;
  }
  e.target.value = '';
});

function selectAddress(addr) {
  active = addr;
  pending = null;
  polyVerts = [];
  if (mode === 'rect') {
    status.textContent = `Pick the NW corner of "${addr}".`;
  } else {
    status.textContent = `Click vertices for "${addr}". Hit Finish when done.`;
  }
  renderList();
  renderShapes();
}

function renderShapes() {
  // Clear visible markers / rects / polys, rebuild.
  overlay.querySelectorAll('.marker, .rect, svg.poly-overlay').forEach(n => n.remove());

  // Rect-typed saved shapes (drawn as div boxes — keeps overlay simple).
  const polys = [];
  for (const [addr, p] of Object.entries(positions)) {
    if (p.type === 'polygon') { polys.push([addr, p]); continue; }
    const r = document.createElement('div');
    r.className = 'rect' + (addr === active ? '' : ' done');
    r.style.left = p.x + 'px';
    r.style.top  = p.y + 'px';
    r.style.width = p.w + 'px';
    r.style.height = p.h + 'px';
    r.textContent = addr.match(/^\d+/)?.[0] || addr;
    overlay.appendChild(r);
  }

  // Polygon-typed saved shapes (drawn in an SVG layer matching overlay size).
  if (polys.length || polyVerts.length || pending) {
    const ov = overlay.getBoundingClientRect();
    const sx = img.naturalWidth, sy = img.naturalHeight;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'poly-overlay');
    svg.setAttribute('viewBox', `0 0 ${sx} ${sy}`);
    svg.setAttribute('preserveAspectRatio', 'none');
    Object.assign(svg.style, {
      position: 'absolute', top: '0', left: '0', width: '100%', height: '100%',
      pointerEvents: 'none',
    });
    for (const [addr, p] of polys) {
      const isActive = addr === active;
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', p.points);
      poly.setAttribute('fill', isActive ? 'rgba(255,0,0,0.08)' : 'rgba(0,100,0,0.06)');
      poly.setAttribute('stroke', isActive ? 'red' : '#060');
      poly.setAttribute('stroke-width', '2');
      svg.appendChild(poly);

      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', p.x + p.w / 2);
      t.setAttribute('y', p.y + p.h / 2);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('fill', isActive ? 'red' : '#060');
      t.setAttribute('font', '12px ui-monospace, monospace');
      t.setAttribute('font-weight', 'bold');
      t.textContent = addr.match(/^\d+/)?.[0] || addr;
      svg.appendChild(t);
    }
    // Live polygon being drawn for the active address.
    if (polyVerts.length > 0) {
      const ptsStr = polyVerts.map(v => `${v.x},${v.y}`).join(' ');
      const live = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      live.setAttribute('points', ptsStr);
      live.setAttribute('fill', 'none');
      live.setAttribute('stroke', 'red');
      live.setAttribute('stroke-width', '2');
      live.setAttribute('stroke-dasharray', '4 3');
      svg.appendChild(live);
      // small dots at each vertex
      for (const v of polyVerts) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', v.x); c.setAttribute('cy', v.y); c.setAttribute('r', 5);
        c.setAttribute('fill', 'white'); c.setAttribute('stroke', 'red'); c.setAttribute('stroke-width', '2');
        svg.appendChild(c);
      }
    }
    overlay.appendChild(svg);
  }

  if (pending) {
    const m = document.createElement('div');
    m.className = 'marker';
    m.style.left = pending.x + 'px';
    m.style.top  = pending.y + 'px';
    overlay.appendChild(m);
  }
}

function finishPolygon() {
  if (!active) { status.textContent = 'Pick an address first.'; return; }
  if (polyVerts.length < 3) { status.textContent = 'Need at least 3 vertices.'; return; }
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const v of polyVerts) {
    if (v.x < minX) minX = v.x; if (v.x > maxX) maxX = v.x;
    if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;
  }
  positions[active] = {
    type: 'polygon',
    points: polyVerts.map(v => `${v.x},${v.y}`).join(' '),
    x: minX, y: minY, w: maxX - minX, h: maxY - minY,
  };
  status.textContent = `Saved "${active}" as polygon (${polyVerts.length} verts). Pick another.`;
  polyVerts = [];
  const idx = ADDRESSES.indexOf(active);
  const next = ADDRESSES.slice(idx + 1).find(a => !positions[a]);
  active = next || null;
  renderList();
  renderShapes();
}

overlay.addEventListener('click', (e) => {
  if (!active) {
    status.textContent = 'Pick an address from the list first.';
    return;
  }
  const rect = overlay.getBoundingClientRect();
  // Map screen click to natural-image pixel coords.
  const sx = img.naturalWidth / rect.width;
  const sy = img.naturalHeight / rect.height;
  const x = Math.round((e.clientX - rect.left) * sx);
  const y = Math.round((e.clientY - rect.top)  * sy);

  if (mode === 'polygon') {
    polyVerts.push({ x, y });
    status.textContent = `${polyVerts.length} vertex${polyVerts.length === 1 ? '' : 'es'}. Keep clicking, then Finish.`;
    renderShapes();
    return;
  }

  // rect mode
  if (!pending) {
    pending = { x, y };
    status.textContent = `NW set at (${x}, ${y}). Now click the SE corner of "${active}".`;
    renderShapes();
  } else {
    const x1 = Math.min(pending.x, x);
    const y1 = Math.min(pending.y, y);
    const w  = Math.abs(x - pending.x);
    const h  = Math.abs(y - pending.y);
    positions[active] = { type: 'rect', x: x1, y: y1, w, h };
    status.textContent = `Saved "${active}" → (${x1}, ${y1}) ${w}×${h}. Pick another address.`;
    pending = null;
    const idx = ADDRESSES.indexOf(active);
    const next = ADDRESSES.slice(idx + 1).find(a => !positions[a]);
    active = next || null;
    renderList();
    renderShapes();
  }
});

// Double-click anywhere on overlay finishes polygon mode.
overlay.addEventListener('dblclick', (e) => {
  if (mode === 'polygon' && polyVerts.length >= 3) {
    e.preventDefault();
    finishPolygon();
  }
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const lines = ['  const POSITIONS = {'];
  for (const addr of ADDRESSES) {
    const p = positions[addr];
    if (!p) continue;
    const num = (addr.match(/^\d+/) || [addr])[0];
    if (p.type === 'polygon') {
      lines.push(`    ${JSON.stringify(addr)}: { x: ${p.x}, y: ${p.y}, w: ${p.w}, h: ${p.h}, short: ${JSON.stringify(num)}, parts: [{ type: "polygon", points: ${JSON.stringify(p.points)} }] },`);
    } else {
      lines.push(`    ${JSON.stringify(addr)}: { x: ${p.x}, y: ${p.y}, w: ${p.w}, h: ${p.h}, short: ${JSON.stringify(num)} },`);
    }
  }
  lines.push('  };');
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    status.textContent = `Copied POSITIONS for ${Object.keys(positions).length} addresses to clipboard.`;
  });
});

document.getElementById('save-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(positions, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'positions.json'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Wipe all captured positions?')) return;
  for (const k in positions) delete positions[k];
  pending = null;
  polyVerts = [];
  active = ADDRESSES[0];
  renderList();
  renderShapes();
  status.textContent = 'Reset. Pick an address.';
});

document.getElementById('reset-one-btn').addEventListener('click', () => {
  if (!active) {
    status.textContent = 'Pick an address from the list first.';
    return;
  }
  const had = !!positions[active];
  delete positions[active];
  pending = null;
  polyVerts = [];
  renderList();
  renderShapes();
  status.textContent = had
    ? `Cleared "${active}". Recapture it now (or pick another).`
    : `"${active}" had no capture yet — nothing to reset.`;
});

renderList();
selectAddress(ADDRESSES[0]);
</script>

</body>
</html>
