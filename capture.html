<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture building coordinates</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, system-ui, "SF Pro Text", sans-serif; background: #fafafa; color: #111; }
  body { display: flex; height: 100vh; overflow: hidden; }
  #side {
    flex: 0 0 320px;
    background: #fff;
    border-right: 1px solid #000;
    display: flex;
    flex-direction: column;
  }
  #side-head {
    padding: 12px;
    border-bottom: 1px solid #000;
    background: #f5f5f5;
  }
  #side-head h1 { margin: 0 0 6px; font-size: 14px; }
  #side-head p { margin: 0; font: 11px/1.4 ui-monospace, monospace; color: #555; }
  #addr-list {
    flex: 1 1 auto;
    overflow-y: auto;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  #addr-list li {
    padding: 8px 12px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    font: 12px/1.4 ui-monospace, monospace;
    display: flex;
    justify-content: space-between;
  }
  #addr-list li:hover { background: #f0f0f0; }
  #addr-list li.active { background: #000; color: #fff; }
  #addr-list li.done { color: #060; }
  #addr-list li.done::after { content: '✓'; }
  #addr-list li.active::after { content: '◆'; }
  #side-foot {
    padding: 10px 12px;
    border-top: 1px solid #000;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #side-foot button {
    height: 36px;
    border: 1px solid #000;
    background: #fff;
    color: #000;
    font: 12px/1 inherit;
    cursor: pointer;
  }
  #side-foot button:hover { background: #000; color: #fff; }
  #status {
    font: 11px/1.3 ui-monospace, monospace;
    color: #555;
    padding: 4px 0;
    min-height: 28px;
  }
  #map-wrap {
    flex: 1 1 auto;
    overflow: auto;
    padding: 16px;
    background: #fafafa;
  }
  #stage {
    position: relative;
    display: inline-block;
    box-shadow: 0 0 0 1px #000;
  }
  #map-img {
    display: block;
    max-width: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    cursor: crosshair;
    pointer-events: auto;
  }
  .marker {
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid red;
    background: rgba(255,255,255,0.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .rect {
    position: absolute;
    border: 2px solid red;
    background: rgba(255, 0, 0, 0.08);
    pointer-events: none;
    font: bold 11px ui-monospace, monospace;
    color: red;
    padding: 2px 4px;
    line-height: 1;
  }
  .rect.done { border-color: #060; color: #060; background: rgba(0, 100, 0, 0.06); }
  textarea {
    width: 100%;
    min-height: 120px;
    font: 11px ui-monospace, monospace;
    border: 1px solid #000;
    padding: 8px;
    resize: vertical;
  }
</style>
</head>
<body>

<aside id="side">
  <div id="side-head">
    <h1>Capture building positions</h1>
    <p>1. Click an address.<br>2. Click NW corner of the building on the map.<br>3. Click SE corner. Done. Repeat.</p>
  </div>
  <ul id="addr-list"></ul>
  <div id="side-foot">
    <div id="status">Pick an address.</div>
    <button id="copy-btn">Copy POSITIONS as JS</button>
    <button id="save-btn">Download positions.json</button>
    <button id="reset-btn">Reset all</button>
  </div>
</aside>

<main id="map-wrap">
  <div id="stage">
    <img id="map-img" src="map_greyscale.jpg" alt="">
    <div id="overlay"></div>
  </div>
</main>

<script>
const ADDRESSES = [
  "1910 N. Main Street",
  "1918 N. Main Street",
  "1920 N. Main Street",
  "1930 N. Main Street",
  "1940 N. Main Street",
  "1950 N. Main Street",
  "1960 N. Main Street",
  "1980 N. Main Street",
  "1984 N. Main Street",
  "2020 N. Main Street",
  "2100 N. Main Street",
  "600 Moulton Avenue",
  "602 Moulton Avenue",
  "604 Moulton Avenue",
  "610 Moulton Avenue",
  "612 Moulton Avenue",
  "618 Moulton Avenue",
  "620 Moulton Avenue",
  "622 Moulton Avenue",
  "624 Moulton Avenue",
  "626 Moulton Avenue",
  "632 Moulton Avenue",
  "634 Moulton Avenue",
  "638 Moulton Avenue",
  "642 Moulton Avenue",
  "645 Moulton Avenue",
  "650 Moulton Avenue",
  "650 South Avenue 21",
  "660 South Avenue 21",
  "670 Moulton Avenue",
  "672 South Avenue 21",
  "676 South Avenue 21",
  "690 Moulton Avenue",
  "692 Moulton Avenue",
  "696 Moulton Avenue",
  "621 Avenue 21",
];

const positions = {};   // addr → {x, y, w, h}
let active = null;
let pending = null;    // first click stored here

const list = document.getElementById('addr-list');
const status = document.getElementById('status');
const overlay = document.getElementById('overlay');
const stage = document.getElementById('stage');
const img = document.getElementById('map-img');

// Pre-load to size the overlay correctly.
img.addEventListener('load', () => {
  // Display at intrinsic 1019×913 size — coords are in image pixels.
  console.log('map loaded:', img.naturalWidth, 'x', img.naturalHeight);
});

function renderList() {
  list.innerHTML = '';
  for (const addr of ADDRESSES) {
    const li = document.createElement('li');
    li.textContent = addr;
    if (addr === active) li.classList.add('active');
    if (positions[addr]) li.classList.add('done');
    li.addEventListener('click', () => selectAddress(addr));
    list.appendChild(li);
  }
}

function selectAddress(addr) {
  active = addr;
  pending = null;
  status.textContent = `Pick the NW corner of "${addr}".`;
  renderList();
}

function renderShapes() {
  // Clear all visible markers/rects then rebuild.
  overlay.querySelectorAll('.marker, .rect').forEach(n => n.remove());
  for (const [addr, p] of Object.entries(positions)) {
    const r = document.createElement('div');
    r.className = 'rect' + (addr === active ? '' : ' done');
    r.style.left = p.x + 'px';
    r.style.top  = p.y + 'px';
    r.style.width = p.w + 'px';
    r.style.height = p.h + 'px';
    r.textContent = addr.match(/^\d+/)?.[0] || addr;
    overlay.appendChild(r);
  }
  if (pending) {
    const m = document.createElement('div');
    m.className = 'marker';
    m.style.left = pending.x + 'px';
    m.style.top  = pending.y + 'px';
    overlay.appendChild(m);
  }
}

overlay.addEventListener('click', (e) => {
  if (!active) {
    status.textContent = 'Pick an address from the list first.';
    return;
  }
  const rect = overlay.getBoundingClientRect();
  // Map screen click to natural-image pixel coords.
  const sx = img.naturalWidth / rect.width;
  const sy = img.naturalHeight / rect.height;
  const x = Math.round((e.clientX - rect.left) * sx);
  const y = Math.round((e.clientY - rect.top)  * sy);

  if (!pending) {
    pending = { x, y };
    status.textContent = `NW set at (${x}, ${y}). Now click the SE corner of "${active}".`;
    renderShapes();
  } else {
    const x1 = Math.min(pending.x, x);
    const y1 = Math.min(pending.y, y);
    const w  = Math.abs(x - pending.x);
    const h  = Math.abs(y - pending.y);
    positions[active] = { x: x1, y: y1, w, h };
    status.textContent = `Saved "${active}" → (${x1}, ${y1}) ${w}×${h}. Pick another address.`;
    pending = null;
    // auto-advance
    const idx = ADDRESSES.indexOf(active);
    const next = ADDRESSES.slice(idx + 1).find(a => !positions[a]);
    active = next || null;
    renderList();
    renderShapes();
  }
});

document.getElementById('copy-btn').addEventListener('click', () => {
  const lines = ['  const POSITIONS = {'];
  for (const addr of ADDRESSES) {
    const p = positions[addr];
    if (!p) continue;
    const num = (addr.match(/^\d+/) || [addr])[0];
    lines.push(`    ${JSON.stringify(addr)}: { x: ${p.x}, y: ${p.y}, w: ${p.w}, h: ${p.h}, short: ${JSON.stringify(num)} },`);
  }
  lines.push('  };');
  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(() => {
    status.textContent = `Copied POSITIONS for ${Object.keys(positions).length} addresses to clipboard.`;
  });
});

document.getElementById('save-btn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(positions, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'positions.json'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('Wipe all captured positions?')) return;
  for (const k in positions) delete positions[k];
  pending = null;
  active = ADDRESSES[0];
  renderList();
  renderShapes();
  status.textContent = 'Reset. Pick an address.';
});

renderList();
selectAddress(ADDRESSES[0]);
</script>

</body>
</html>
